[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glint-player"
version = "0.13.1"
description = "Glint — an original open-source media player built on Python, Qt and libmpv"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Glint contributors" }]
keywords = ["media", "player", "video", "audio", "mpv", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Display",
]
dependencies = [
    "PySide6>=6.6",
    "python-mpv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "pytest-timeout>=2.3", "ruff>=0.6"]

[project.scripts]
glint = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["assets/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
